<!DOCTYPE html>
<html lang="tr">
<head>

<title>Sayfa Bulunamadı — KM Nutrition Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f2a20;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(184,151,61,.08),transparent 60%)}
.content{position:relative;z-index:2;max-width:520px}
.num{font-family:'Playfair Display',serif;font-size:clamp(100px,20vw,160px);font-weight:900;line-height:1;background:linear-gradient(135deg,#B8973D,#E8C96A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.icon{font-size:48px;margin-bottom:20px}
h1{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,32px);font-weight:700;color:#fff;margin-bottom:12px}
p{font-size:15px;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:40px;font-weight:300}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-gold{background:linear-gradient(135deg,#B8973D,#E8C96A);color:#1a1a1a;text-decoration:none;border-radius:12px;padding:13px 24px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn-out{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;border-radius:12px;padding:12px 22px;font-size:14px;display:inline-flex;align-items:center;gap:6px}

/* WhatsApp */
.wa{position:fixed;bottom:28px;right:28px;width:52px;height:52px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.4);text-decoration:none;transition:transform .2s}
.wa:hover{transform:scale(1.1)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="content">
  <div class="num">404</div>
  <div class="icon">🌿</div>
  <h1>Sayfa bulunamadı</h1>
  <p>Aradığınız sayfa taşınmış, silinmiş veya hiç var olmamış olabilir. Ana sayfaya dönün.</p>
  <div class="btns">
    <a href="index.html" class="btn-gold">🏠 Ana Sayfaya Dön</a>
    <a href="https://wa.me/905422050936" target="_blank" class="btn-out">💬 Yardım Al</a>
  </div>
</div>

    category: "Kilo Yönetimi", emoji: "⚖️", readTime: "7 dk",
    excerpt: "Kalıcı kilo vermenin bilimsel yollarını öğrenin. Hızlı diyetlerin neden işe yaramadığını ve uzun vadeli başarı için ne yapmanız gerektiğini keşfedin.",
    status: "published",
    content: `<h2>Hızlı Diyetler Neden İşe Yaramaz?</h2><p>Her yıl milyonlarca kişi hızlı kilo verme diyetleri dener — ve büyük çoğunluğu birkaç ay içinde eski kilosuna döner. Bunun temel nedeni, kısa vadeli kısıtlamaların uzun vadeli davranış değişikliği oluşturmamasıdır. Çok düşük kalorili diyetler vücudu strese sokar, bazal metabolizma hızını düşürür ve kas kaybına yol açar.</p><h2>1. Kalori Açığını Makul Tutun</h2><p>Kilo vermek için günlük enerji harcamanızdan daha az kalori almanız gerekir. Günlük 300-500 kalori açığı, haftada yaklaşık 0,3-0,5 kg kayıp sağlar; bu hem sürdürülebilir hem de sağlıklıdır. 1000 kalori ve üzeri açık kas kaybına neden olur.</p><h2>2. Protein Alımını Artırın</h2><p>Yüksek protein alımı tokluk hissini uzatır, kas kütlesini korur ve sindirim için daha fazla enerji harcar. Hedef: vücut ağırlığınızın kilogramı başına 1,6-2,2 gram protein. Yumurta, tavuk, yoğurt, baklagiller ve balık başlıca kaynaklardır.</p><h2>3. İşlenmiş Gıdaları Azaltın</h2><p>Ultra işlenmiş gıdalar hem çok kalorili hem düşük besin değerlidir. Beyin bu gıdaları "yeterli" hissetmekte zorlanır ve aşırı yeme döngüsü başlar. Rafında 5'ten fazla malzeme bulunan ambalajlı ürünlere dikkat edin.</p><h2>4. Lif Tüketimini Artırın</h2><p>Diyet lifi kan şekerini dengeleyerek ani açlık krizlerini önler. Günlük 25-35 gram lif hedefleyin. Özellikle öğünlerin başında salata veya çorba tüketmek, toplam kalori alımını otomatik olarak düşürür.</p><h2>5. Düzenli Uyku Uyuyun</h2><p>Az uyku ghrelin (açlık hormonu) düzeyini artırır, leptin (tokluk hormonu) düzeyini düşürür ve tatlı ile yüksek kalorili gıdalara olan isteği artırır. Gece 7-9 saat kaliteli uyku kilo yönetimine önemli katkı sağlar.</p><h2>6. Hareketi Günlük Hayatınıza Entegre Edin</h2><p>Spor salonuna gitme zorunluluğu yoktur. NEAT (Egzersiz dışı aktivite termogenezi) olarak bilinen günlük hareketler uzun vadede büyük fark yaratır. Günde en az 8.000-10.000 adım hedefleyin.</p><h2>7. Sabırlı Olun ve Süreci Takip Edin</h2><p>Kilo verme doğrusal bir süreç değildir. Haftada bir, sabah aç karnına aynı koşullarda tartılın. Aylık ortalamaları karşılaştırın, tek tek ölçümlere takılmayın.</p>`

    content: `<h2>Glisemik İndeks Nedir?</h2><p>Glisemik indeks (GI), bir besinin kan şekerini ne hızda yükselttiğini gösteren 0-100 arası bir ölçüdür. Düşük GI (55 altı): Mercimek, yulaf, elma, tam buğday ekmeği. Yüksek GI (70 üzeri): Beyaz ekmek, patates püresi, şekerli içecekler. Diyabetli bireyler için düşük ve orta GI'li gıdalar kan şekeri dalgalanmalarını azaltır.</p><h2>Tabak Modeli</h2><p>Her öğünde tabağınızı şöyle bölün: Yarısı nişastalı olmayan sebzeler (brokoli, ıspanak, domates). Çeyreği protein (tavuk, balık, yumurta, baklagiller). Çeyreği kaliteli karbonhidrat (bulgur, tam tahıl, tatlı patates).</p><h2>Kaçınılması Gereken Gıdalar</h2><ul><li>Şekerli içecekler (meyve suyu dahil)</li><li>Beyaz ekmek ve pirinç</li><li>Şekerli tatlılar ve pastalar</li><li>Yüksek yağlı işlenmiş et ürünleri</li></ul><h2>Öğün Zamanlaması</h2><p>Uzun süreli açlık kan şekerini dengesizleştirebilir. Günde 3 ana öğün ve gerekirse 1-2 ara öğün kan şekerinin daha stabil seyrelmesine yardımcı olur. Öğün atlamaktan kaçının.</p><h2>Faydalı Besinler</h2><p>Zeytin yağı insülin direncini azaltabilir. Tarçın kan şekerini hafif düşürdüğüne dair kanıtlar mevcut. Sirke glisemik yanıtı yavaşlatır. Yeşil yapraklı sebzeler düşük kalori, yüksek besin değeri sunar.</p>`

    status: "published",
    content: `<h2>Karbonhidrat: Performansın Yakıtı</h2><p>Karbonhidratlar egzersiz sırasında kasların birincil enerji kaynağıdır. Günlük ihtiyaç aktiviteye göre: Hafif egzersiz 3-5 g/kg, orta egzersiz 5-7 g/kg, yoğun egzersiz 6-10 g/kg vücut ağırlığı.</p><h2>Protein: Kasların Yapı Taşı</h2><p>Sporcularda günlük protein ihtiyacı: Dayanıklılık sporcuları 1,2-1,6 g/kg, kuvvet sporcuları 1,6-2,2 g/kg. Yumurta, tavuk, ton balığı, yoğurt ve baklagiller kaliteli kaynaklardır.</p><h2>Antrenman Öncesi Beslenme</h2><p>2-3 saat önce: Orta-yüksek karbonhidrat + orta protein + düşük yağ ve lif. Örnek: Tam buğday makarna + tavuk göğsü + az salata. 30-60 dakika önce: Muz + yoğurt veya yulaf + bal.</p><h2>Egzersiz Sonrası Toparlanma</h2><p>Egzersiz bittikten sonraki 30-60 dakika kritiktir. Hedef: 20-40 gram protein + 40-80 gram karbonhidrat. Pratik seçenekler: Proteinli smoothie, yoğurt + meyve + granola, yumurta + tam tahıl ekmek.</p><h2>Hidrasyon</h2><p>Vücut ağırlığının %2 sıvı kaybı performansı %10-20 düşürür. Egzersizden 2 saat önce 400-600 ml su, egzersiz sırasında her 15-20 dakikada 150-250 ml su için.</p>`
  },
  {
    title: "Okul Çağı Çocuklarında Sağlıklı Beslenme Rehberi",
    category: "Çocuk Beslenmesi", emoji: "👧", readTime: "7 dk",
    excerpt: "6-12 yaş çocuklar için dengeli beslenme önerileri. Demir, kalsiyum, vitamin ihtiyaçları ve sağlıklı atıştırmalık fikirleri.",
    status: "published",
    content: `<h2>Neden Kritik Bir Dönem?</h2><p>6-12 yaş döneminde sağlanan yeterli ve dengeli beslenme; büyüme, okul başarısı, bağışıklık sistemi ve gelecekteki sağlık alışkanlıkları üzerinde kalıcı etkiler bırakır.</p><h2>Kalsiyum: Kemikler İçin Vazgeçilmez</h2><p>Günlük ihtiyaç: 6-8 yaş 1000 mg, 9-12 yaş 1300 mg. Kaynaklar: Süt (240 ml = ~300 mg), yoğurt, peynir, yeşil yapraklı sebzeler, tahin.</p><h2>Demir: Dikkat ve Enerji İçin</h2><p>Demir eksikliği çocuklarda en sık görülen besin eksikliğidir. Dikkat dağınıklığı ve okul başarısında düşme belirtisi olabilir. Kaynaklar: Kırmızı et, tavuk, balık, yumurta, mercimek, ıspanak. C vitamini ile birlikte tüketmek emilimi artırır.</p><h2>Sağlıklı Kahvaltının Etkisi</h2><p>Düzenli kahvaltı yapan çocukların dikkat, hafıza ve problem çözme becerileri daha iyi olmaktadır. İdeal kahvaltı: Yumurta + tam tahıl ekmek + bir porsiyon meyve + süt veya ayran.</p><h2>Sağlıklı Atıştırmalık Fikirleri</h2><ul><li>Mevsim meyvesi + bir avuç fındık</li><li>Yoğurt + granola + meyve</li><li>Tam buğday krakerler + peynir</li><li>Havuç + salatalık + humus</li><li>Haşlanmış yumurta</li></ul>`
  },

    status: "published",
    content: `<h2>Ek Gıdaya Ne Zaman Başlanmalı?</h2><p>DSÖ ilk 6 ay boyunca yalnızca anne sütü önerir. 6. aydan sonra anne sütüne devam ederken ek gıdalar başlanabilir. Erken başlamak sindirim sorunlarına ve alerji riskine, geç kalmak demir eksikliğine yol açabilir.</p><h2>Hazır Olma Belirtileri</h2><ul><li>Destekle oturabilme ve başını dik tutabilme</li><li>Yiyeceklere ilgi gösterme</li><li>Dil itme refleksinin azalması</li></ul><h2>İlk Hangi Besinler Verilmeli?</h2><p>Her yeni besini 3-5 gün bekleyerek verin. Demir zengini tahıllar, püresi yapılmış sebzeler (kabak, havuç, patates), meyveler (elma, armut, muz, avokado) ve et püresi iyi başlangıç besinleridir.</p><h2>1 Yaş Altı Kaçınılacaklar</h2><ul><li><strong>Bal:</strong> Botulizm riski</li><li><strong>İnek sütü (içecek olarak)</strong></li><li><strong>Tuz ve şeker</strong></li><li>Boğulma riski taşıyan besinler</li></ul><h2>BLW (Baby-Led Weaning) Nedir?</h2><p>Bebek önderli tamamlayıcı beslenmede bebek, püresi yerine parmakla tutabileceği yumuşak parçalar yer. Özerk yeme ve açlık/tokluk farkındalığını geliştirir, motor beceri gelişimini destekler.</p>`

    excerpt: "Her üç dönemde ihtiyaç duyulan besinler, kaçınılması gereken gıdalar ve pratik öğün önerileri.",
    status: "published",
    content: `<h2>Kalori İhtiyacı Ne Kadar Artar?</h2><ul><li><strong>İlk trimester:</strong> Ek kalori gerekmez</li><li><strong>İkinci trimester:</strong> Günde yaklaşık +300 kalori</li><li><strong>Üçüncü trimester:</strong> Günde yaklaşık +450 kalori</li></ul><p>"İki kişilik yemek" miti yanlıştır.</p><h2>Folik Asit: Gebelik Öncesinden Başlayın</h2><p>Nöral tüp defektlerini önlemek için gebelikten en az 1 ay önce başlanmalı ve ilk üç ay devam edilmelidir. Günlük 400-800 mcg folik asit takviyesi önerilir.</p><h2>Kaçınılacak Gıdalar</h2><ul><li>Çiğ veya az pişmiş et/balık/yumurta</li><li>Pastörize edilmemiş süt ürünleri</li><li>Yüksek cıvalı balıklar</li><li>Alkol (güvenli miktarı yoktur)</li><li>Aşırı kafein (günde 200 mg altında tutun)</li></ul><h2>Trimester Bazlı İhtiyaçlar</h2><p><strong>1. Trimester:</strong> Folik asit, B6 vitamini, küçük ve sık öğünler.</p><p><strong>2. Trimester:</strong> Demir, kalsiyum, protein artışı.</p><p><strong>3. Trimester:</strong> Omega-3, lif, D vitamini.</p>`
  },
  {
    title: "Emzirme Döneminde Beslenme: Süt Kalitesi ve Miktar",
    category: "Gebelik & Emzirme", emoji: "🍼", readTime: "7 dk",

    status: "published",
    content: `<h2>Enerji İhtiyacı</h2><p>Günlük süt üretimi için yaklaşık 500-600 kalori ek enerji harcanır. Emziren annelerin günde 300-500 kalori fazladan alması önerilir. 1500 kalorin altına inmek süt üretimini azaltabilir.</p><h2>Sıvı Tüketimi: Süt Üretiminin Temeli</h2><p>Anne sütünün %87'si sudur. Günde en az 2-3 litre sıvı tüketimi önerilir. Pratik ipucu: Her emzirmeden önce bir bardak su için.</p><h2>Süt Artırıcı Besinler</h2><ul><li>Yulaf ezmesi</li><li>Rezene çayı</li><li>Çemen otu</li><li>Arpa</li><li>Badem</li></ul><h2>Emzirirken Kaçınılacaklar</h2><ul><li>Alkol (içilecekse emzirmeden 2-3 saat bekleyin)</li><li>Aşırı kafein (bebekte uyku sorununa yol açabilir)</li><li>Adaçayı ve nane (süt miktarını azaltabilir)</li></ul><h2>Kilo Verme Baskısına Dikkat</h2><p>Emzirme başlı başına kalori yakar ve doğal zayıflamayı destekler. Sütten kesilme sonrasında daha kapsamlı bir program uygulanabilir.</p>`

  {
    title: "Aralıklı Oruç (Intermittent Fasting): Faydaları ve Riskleri",
    category: "Kilo Yönetimi", emoji: "⏰", readTime: "8 dk",
    excerpt: "16:8, 5:2 ve diğer yöntemlerini bilimsel verilerle inceleyin. Kimler yapabilir, kimler yapmamalı?",
    status: "published",
    content: `<h2>Başlıca Yöntemler</h2><p><strong>16:8:</strong> Günde 16 saat oruç, 8 saatlik yeme penceresi. En yaygın yöntem. Örn: Saat 12:00-20:00 arası yemek.</p><p><strong>5:2:</strong> Haftanın 5 günü normal yemek, 2 günü çok düşük kalori (500-600 kcal).</p><p><strong>OMAD:</strong> Günde tek öğün — sürdürmesi zor.</p><h2>Bilimsel Kanıtlar</h2><ul><li>Kilo ve vücut yağ yüzdesi azalması</li><li>İnsülin duyarlılığında iyileşme</li><li>LDL kolesterol ve trigliserid düzeyi düşüşü</li><li>Kan basıncında hafif azalma</li></ul><h2>Kimler Yapmamalı?</h2><ul><li>Hamile ve emziren anneler</li><li>18 yaş altı çocuk ve ergenler</li><li>Yeme bozukluğu geçmişi olan bireyler</li><li>İnsülin veya hipoglisemik ilaç kullananlar</li></ul><h2>Oruç Döneminde Ne İçilebilir?</h2><p>Kalori içermeyen içecekler orucu bozmaz: Su, soda water (sade), siyah kahve, sade çay. Süt, meyve suyu ve şekerli içecekler orucu bozar.</p><h2>Pratik İpuçları</h2><ul><li>Yeme penceresini öğle-akşam olarak ayarlayın</li><li>Yeme penceresinde besleyici öğünler yiyin</li><li>Sosyal hayatı göz önünde bulundurun</li></ul>`

    title: "Kolesterolü Doğal Yollarla Düşüren Beslenme Önerileri",
    category: "Hastalığa Özel Beslenme", emoji: "🫀", readTime: "8 dk",
    excerpt: "LDL kolesterolü düşürmek için kanıtlanmış beslenme stratejileri. Hangi yağlar zararlı, omega-3 ve lif tüketiminin önemi.",
    status: "published",
    content: `<h2>Doymuş Yağları Azaltın</h2><p>Doymuş yağ LDL kolesterolü artıran en önemli diyet faktörüdür. Sınırlayın: Tereyağı, yağlı kırmızı et, salam-sucuk, tam yağlı peynir, hindistancevizi yağı.</p><h2>Trans Yağlar: En Tehlikeli Yağ</h2><p>Trans yağlar hem LDL'i artırır hem de HDL'i düşürür. Kaçının: Margarin, endüstriyel kek-bisküviler, hazır popcorn ve kızarmış hazır gıdalar.</p><h2>Çözünür Lif: LDL'in Doğal Düşmanı</h2><p>Günlük 5-10 gram çözünür lif LDL'i %3-5 oranında düşürebilir. Zengin kaynaklar: Yulaf ezmesi, elma, armut, fasulye, mercimek, brokoli.</p><h2>Omega-3 Yağ Asitleri</h2><p>Omega-3 ağırlıklı olarak trigliseritleri düşürür ve anti-enflamatuvar etki gösterir. Haftada 2-3 kez yağlı balık (somon, uskumru, sardalya, hamsi) tüketmek önerilir.</p><h2>Tekli Doymamış Yağlar: Kalp Dostu</h2><p>Doymuş yağların yerini tekli doymamış yağlarla değiştirmek LDL'i düşürürken HDL'i korur. Zengin kaynaklar: Zeytinyağı, avokado, badem, fındık, yer fıstığı.</p>`
  }

window.migrate = async function() {
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true;
  log.innerHTML = '<span class="info">Aktarım başlıyor...\n</span>';

  let success = 0, fail = 0;
  for (const article of ARTICLES) {
    try {
      const ref = await addDoc(collection(db, 'articles'), {
        ...article,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      log.innerHTML += `<span class="ok">✓ ${article.title} (${ref.id})\n</span>`;
      success++;
    } catch(e) {
      log.innerHTML += `<span class="err">✗ ${article.title}: ${e.message}\n</span>`;
      fail++;
    }
  }

  log.innerHTML += `\n<span class="info">Tamamlandı: ${success} başarılı, ${fail} başarısız.\n</span>`;
  if(success > 0) {
    log.innerHTML += `<span class="ok">\n✅ Admin panelini açıp Makaleler sekmesini kontrol edin.\n⚠️ Bu sayfayı artık silebilirsiniz.\n</span>`;
  }
  btn.textContent = 'Tamamlandı';
};
</script>
